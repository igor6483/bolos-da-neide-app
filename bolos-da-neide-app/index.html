<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bolos da neide</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <header>
      <section id="logo">
        <img src="assets/img/logo.png" alt="foto da logo"/>
        <h2>Bolos da neide</h2>
      </section>  
      <section id="inicio">
        <p>cadastrar-se</p>
        <p>iniciar sessão</p>
        <p>menu</p>
      </section>
    </header>
     <main>
    <section id="banner">
            <p>Aplicativo para reservar bolos e cadastro de clientes </p>
            <img src="./assets/img/banner.png" alt="banner da loja">
    </section>
    <section id="centro">
        <article id="servicos">
    <ul> <h3>sabores disponiveis:</h3>
        <li><h3>chocolate</h3></li>
        <li><h3>morango</h3></li>
        <li><h3>banana</h3></li>
        <li><h3>goiabada</h3></li>
    </ul>
    </article>
    <article id='tabela'>
        <table>
            <tr>
                <td>sabor</td>
                <td>preço</td>
            </tr>
            <tr>
                <td>chocolate</td>
                <td>25</td>
            </tr>
            <tr>
                <td>morango</td>
                <td>30</td>
            </tr>
            <tr>
                <td>banana</td>
                <td>18</td>
            </tr>
            <tr>
                <td>goiabada</td>
                <td>1500000</td>
            </tr>
        </table>
    </article>
    </section>
    <article id="text">
            <h2>fotos de bolos disponiveis</h2>
        </article>
    <section id="gal">
            <img src="./assets/img/bolo1.png" alt="imagem bolo">
            <img src="./assets/img/bolo2.png" alt="imagem bolo">
            <img src="./assets/img/bolo3.png" alt="imagem bolo">
            <img src="./assets/img/bolo4.png" alt="imagem bolo">
            <img src="./assets/img/bolo5.png" alt="imagem bolo">
            <img src="./assets/img/bolo6.png" alt="imagem bolo">
    </section>

 </main>
    
</body>
</html>
